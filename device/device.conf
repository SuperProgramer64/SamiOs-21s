# The phone, for the common repository's device tooling (the same fields as hakios-a32's device.conf).
device a21s
	title	Samsung Galaxy A21s (SM-A217F / SM-A217M)
	vendor	Samsung
	soc	exynos850
	status boot works SpringBoard and apps reached on physical A21s, current candidate v11
