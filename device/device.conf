	status gpu partial Mali-G52 Panfrost/OpenGL ES active, 51197 job chains with zero failed in a physical run; Metal unimplemented
	status cpu works eight Cortex-A55 cores via GICv2 and gated PSCI adaptations
	status battery missing
	status sensors missing
	status wifi missing Samsung SCSC/WLBT identified, no working XNU driver
	status bluetooth missing shares Samsung WLBT transport; no working XNU HCI integration
	status audio missing
	status camera missing
	status haptic missing
	status cellular missing
